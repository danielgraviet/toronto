[project]
name = "toronto"
version = "0.1.0"
description = "Teach It in Public: verifiable GRPO coding demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "daytona>=0.207.0",
    "fastapi>=0.115",
    "pytest>=9.1.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25"]
daytona = ["daytona>=0.1"]
gpu = [
    "accelerate",
    "datasets",
    "peft",
    "torch",
    "transformers",
    "trl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
