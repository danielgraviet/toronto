id: two_sum_plus
title: Two Sum+
func_name: two_sum
audience_blurb: "Find the lexicographically first pair that adds to a target, or return an empty list."
prompt: |
  # Return the lexicographically first pair of indices [i, j] such that
  # nums[i] + nums[j] == target, with i < j. Lexicographically first means
  # choose the smallest possible i, then the smallest possible j for that i.
  # Return [] when no pair exists. Do not import helper libraries; no eval or exec.

  def two_sum(nums: list[int], target: int) -> list[int]:
      """Return the first valid pair of indices, or [] if none exists."""
prompt_variants:
  - |
    # Implement two_sum. Find indices [i, j] with i < j whose values add to target.
    # Return the lexicographically smallest pair: smallest i first, then smallest j.
    # Return [] if there is no solution. Use pure Python without imports, eval, or exec.
    def two_sum(nums: list[int], target: int) -> list[int]:
        """Find the first pair or return an empty list."""
  - |
    # Complete this function using a deterministic first-pair rule.
    # The answer must be [i, j], i < j, with nums[i] + nums[j] == target.
    # Prefer the lowest left index, then the lowest right index; return [] when absent.
    def two_sum(nums: list[int], target: int) -> list[int]:
        """Return lexicographically first matching indices."""
  - |
    # Write a pure-Python two-sum finder. Duplicate values, negative values, and zeroes
    # are valid. Select the lexicographically smallest valid index pair and return []
    # for an input with no solution. Do not import anything or use eval/exec.
    def two_sum(nums: list[int], target: int) -> list[int]:
        """Return matching indices in deterministic order."""
banned_patterns:
  - "eval("
  - "exec("
  - "__import__"
  - "import "
  - "itertools"
test_groups:
  - name: basic
    weight: 1
    tests:
      - { input: { nums: [2, 7, 11, 15], target: 9 }, output: [0, 1] }
      - { input: { nums: [3, 2, 4], target: 6 }, output: [1, 2] }
      - { input: { nums: [3, 3], target: 6 }, output: [0, 1] }
  - name: edge_values
    weight: 2
    tests:
      - { input: { nums: [0, 4, 3, 0], target: 0 }, output: [0, 3] }
      - { input: { nums: [-1, -2, -3, -4], target: -6 }, output: [1, 3] }
      - { input: { nums: [1, 5, 1, 5], target: 6 }, output: [0, 1] }
  - name: ordering
    weight: 3
    tests:
      - { input: { nums: [1, 2, 3, 4], target: 5 }, output: [0, 3] }
      - { input: { nums: [4, 1, 2, 3], target: 5 }, output: [0, 1] }
  - name: no_solution
    weight: 3
    tests:
      - { input: { nums: [1, 2, 4], target: 8 }, output: [] }
      - { input: { nums: [], target: 0 }, output: [] }
validation_tests:
  - { input: { nums: [10, 20, 30], target: 50 }, output: [1, 2] }
  - { input: { nums: [-5, 8, 2, 5], target: 0 }, output: [0, 3] }
  - { input: { nums: [6, 1, 4, 5], target: 10 }, output: [0, 2] }
  - { input: { nums: [9, 9, 1], target: 18 }, output: [0, 1] }
  - { input: { nums: [2, 4, 8], target: 3 }, output: [] }
  - { input: { nums: [100, -50, 25, -25, -100], target: 0 }, output: [0, 4] }
holdout_tests:
  - { input: { nums: [5, 12, 7, 3], target: 15 }, output: [1, 3] }
  - { input: { nums: [-10, 4, 6, 12], target: 2 }, output: [0, 2] }
  - { input: { nums: [8, 8, 2, 6], target: 16 }, output: [0, 1] }
  - { input: { nums: [11, 1, 10, 0], target: 11 }, output: [0, 1] }
  - { input: { nums: [3, 4, 9], target: 20 }, output: [] }
  - { input: { nums: [0, -1, 1, 5], target: 0 }, output: [0, 2] }
reference: |
  def two_sum(nums: list[int], target: int) -> list[int]:
      for i, left in enumerate(nums):
          for j in range(i + 1, len(nums)):
              if left + nums[j] == target:
                  return [i, j]
      return []
